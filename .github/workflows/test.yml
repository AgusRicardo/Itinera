name: Tests

on:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Itinera
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Itinera.slnx

      - name: Test
        run: dotnet test Itinera.UnitTests/Itinera.UnitTests.csproj --no-restore --filter "Category!=Integration"
