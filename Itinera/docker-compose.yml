services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itinera}
      POSTGRES_USER: ${POSTGRES_USER:-itinera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      # Solo loopback para desarrollo local; no se expone al público del droplet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itinera} -d ${POSTGRES_DB:-itinera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Itinera.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-itinera};Username=${POSTGRES_USER:-itinera};Password=${POSTGRES_PASSWORD}"
      Database__Provider: PostgreSQL
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      PlatformAdmin__Nombre: ${PLATFORM_ADMIN_NOMBRE:-}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL:-}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
