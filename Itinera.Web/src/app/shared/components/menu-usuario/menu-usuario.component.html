<div class="relative">
  <button
    type="button"
    aria-label="Abrir menú de usuario"
    class="flex items-center gap-2 rounded-lg px-2 py-1.5 transition-colors hover:bg-itinera-secondary"
    (click)="alternar($event)"
  >
    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-itinera-accent/30">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="3.5" />
        <path d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5" />
      </svg>
    </span>
    <svg
      class="h-4 w-4 text-itinera-muted transition-transform"
      [class.rotate-180]="abierto()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (abierto()) {
    <div
      class="absolute right-0 top-12 z-20 w-48 rounded-xl border bg-itinera-card p-1.5 shadow-lg"
      (click)="$event.stopPropagation()"
    >
      <span class="block cursor-not-allowed rounded-lg px-3 py-2 text-sm text-itinera-muted/60">
        Configuración · próximamente
      </span>
      <button
        type="button"
        class="w-full rounded-lg px-3 py-2 text-left text-sm text-itinera-muted hover:bg-itinera-secondary"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>
    </div>
  }
</div>
