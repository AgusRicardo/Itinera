<app-menu-principal />

<main class="min-h-screen bg-itinera-background lg:pl-64">
  <header class="flex h-14 items-center border-b bg-itinera-card px-6">
    <a routerLink="/clientes" class="text-sm text-itinera-muted hover:text-itinera-foreground">
      ← Clientes
    </a>
    <span class="mx-3 text-itinera-border">|</span>
    <span class="text-sm font-medium">{{ editando ? 'Editar cliente' : 'Nuevo cliente' }}</span>
  </header>

  <section class="mx-auto w-full max-w-2xl p-6">
    <form
      class="space-y-5 rounded-2xl border bg-itinera-card p-6 shadow-sm"
      [formGroup]="formulario"
      (ngSubmit)="guardar()"
    >
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium" for="nombre">Nombre <span class="text-red-600">*</span></label>
          <input id="nombre" formControlName="nombre" class="w-full rounded-lg border bg-itinera-secondary px-3 py-2.5 text-sm" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium" for="apellido">Apellido <span class="text-red-600">*</span></label>
          <input id="apellido" formControlName="apellido" class="w-full rounded-lg border bg-itinera-secondary px-3 py-2.5 text-sm" />
        </div>
      </div>

      <div>
        <label class="mb-1.5 block text-sm font-medium" for="email">Email <span class="text-red-600">*</span></label>
        <input id="email" type="email" formControlName="email" class="w-full rounded-lg border bg-itinera-secondary px-3 py-2.5 text-sm" />
      </div>

      <div>
        <label class="mb-1.5 block text-sm font-medium" for="telefono">Teléfono <span class="text-red-600">*</span></label>
        <input id="telefono" formControlName="telefono" class="w-full rounded-lg border bg-itinera-secondary px-3 py-2.5 text-sm" />
      </div>

      @if (error()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ error() }}</p>
      }

      <div class="flex gap-3">
        <button
          type="submit"
          [disabled]="formulario.invalid || guardando()"
          class="rounded-lg bg-itinera-foreground px-5 py-2.5 text-sm font-medium text-itinera-background disabled:opacity-60"
        >
          {{ guardando() ? 'Guardando…' : 'Guardar cliente' }}
        </button>
        <a routerLink="/clientes" class="rounded-lg bg-itinera-secondary px-5 py-2.5 text-sm font-medium">
          Cancelar
        </a>
      </div>
    </form>
  </section>
</main>
