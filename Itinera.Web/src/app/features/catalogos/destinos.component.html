<app-menu-principal />

<main class="min-h-screen bg-itinera-background lg:pl-64">
  <section class="mx-auto w-full max-w-7xl px-4 py-7 sm:px-6 lg:px-10 lg:py-10">
    <app-encabezado seccion="Catálogos" titulo="Destinos" descripcion="Destinos asociados a ciudades.">
      <button type="button" class="rounded-lg bg-itinera-foreground px-4 py-2.5 text-sm font-semibold text-itinera-background" (click)="abrir()">+ Nuevo destino</button>
    </app-encabezado>

    <app-filtros-grilla placeholder="Buscar por ciudad o país" [conFiltros]="false" (cambio)="grilla.filtrar($event)" />

    <app-tabla [grilla]="grilla" elementos="destinos">
      <thead>
        <tr>
          <th appColumnaOrdenable="ciudad" [grilla]="grilla">Ciudad</th>
          <th appColumnaOrdenable="pais" [grilla]="grilla">País</th>
          <th class="numero">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (destino of grilla.elementos(); track destino.id) {
          <tr>
            <td class="font-medium">{{ destino.ciudadNombre }}</td>
            <td>{{ destino.paisNombre }}</td>
            <td class="numero"><app-menu-acciones [acciones]="acciones(destino)" /></td>
          </tr>
        }
      </tbody>
    </app-tabla>
  </section>

  @if (modal()) {
    <app-modal seccion="Catálogos" [titulo]="editando() ? 'Editar destino' : 'Nuevo destino'" (cerrar)="cerrar()">
      <form class="space-y-5 p-6" [formGroup]="formulario" (ngSubmit)="guardar()">
      <div>
        <label for="ciudadId" class="mb-1.5 block text-sm font-medium">Ciudad <span class="text-red-600">*</span></label>
        <app-selector idCampo="ciudadId" descripcion="Ciudad" placeholder="Seleccioná una ciudad" formControlName="ciudadId" [opciones]="opcionesCiudades()" />
      </div>
      <div class="flex justify-end gap-2 border-t pt-5">
        <button type="button" class="rounded-lg border px-4 py-2.5 text-sm" [disabled]="guardando()" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="rounded-lg bg-itinera-foreground px-4 py-2.5 text-sm font-semibold text-itinera-background disabled:opacity-50" [disabled]="formulario.invalid || guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
      </form>
    </app-modal>
  }
</main>
