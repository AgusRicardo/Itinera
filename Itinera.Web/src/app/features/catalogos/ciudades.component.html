<app-menu-principal />

<main class="min-h-screen bg-itinera-background lg:pl-64">
  <section class="mx-auto w-full max-w-7xl px-4 py-7 sm:px-6 lg:px-10 lg:py-10">
    <app-encabezado seccion="Catálogos" titulo="Ciudades" descripcion="Ciudades asociadas a cada país.">
      <button type="button" class="rounded-lg bg-itinera-foreground px-4 py-2.5 text-sm font-semibold text-itinera-background" (click)="abrir()">+ Nueva ciudad</button>
    </app-encabezado>

    <app-filtros-grilla placeholder="Buscar por ciudad o país" [conFiltros]="false" (cambio)="grilla.filtrar($event)" />

    <app-tabla [grilla]="grilla" elementos="ciudades">
      <thead>
        <tr>
          <th appColumnaOrdenable="nombre" [grilla]="grilla">Ciudad</th>
          <th appColumnaOrdenable="pais" [grilla]="grilla">País</th>
          <th class="numero">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (ciudad of grilla.elementos(); track ciudad.id) {
          <tr>
            <td class="font-medium">{{ ciudad.nombre }}</td>
            <td>{{ ciudad.paisNombre }}</td>
            <td class="numero"><app-menu-acciones [acciones]="acciones(ciudad)" /></td>
          </tr>
        }
      </tbody>
    </app-tabla>
  </section>

  @if (modal()) {
    <app-modal seccion="Catálogos" [titulo]="editando() ? 'Editar ciudad' : 'Nueva ciudad'" (cerrar)="cerrar()">
      <form class="space-y-5 p-6" [formGroup]="formulario" (ngSubmit)="guardar()">
      <div>
        <label for="nombre" class="mb-1.5 block text-sm font-medium">Nombre <span class="text-red-600">*</span></label>
        <input id="nombre" formControlName="nombre" maxlength="100" class="w-full rounded-lg border bg-itinera-secondary px-3 py-2.5 text-sm" />
        @if (formulario.controls.nombre.touched && formulario.controls.nombre.invalid) {
          <p class="mt-1 text-xs text-red-700">Ingresá un nombre.</p>
        }
      </div>
      <div>
        <label for="paisId" class="mb-1.5 block text-sm font-medium">País <span class="text-red-600">*</span></label>
        <app-selector idCampo="paisId" descripcion="País" placeholder="Seleccioná un país" formControlName="paisId" [opciones]="opcionesPaises()" />
      </div>
      <div class="flex justify-end gap-2 border-t pt-5">
        <button type="button" class="rounded-lg border px-4 py-2.5 text-sm" [disabled]="guardando()" (click)="cerrar()">Cancelar</button>
        <button type="submit" class="rounded-lg bg-itinera-foreground px-4 py-2.5 text-sm font-semibold text-itinera-background disabled:opacity-50" [disabled]="formulario.invalid || guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
      </form>
    </app-modal>
  }
</main>
